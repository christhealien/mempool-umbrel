name: image
# Push a tag like mempool-v1.0.1 to build the two images (frontend + backend) for amd64 and arm64, publish them to
# ghcr.io, then copy the app folder into the store repo christhealien/blake2b (needs the STORE_TOKEN secret).
# The mempool source is the newest upstream release (UPSTREAM_TAG) with this repo's overlay applied on top.
on:
  push:
    tags: ["mempool-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (e.g. 1.0.1)"
        required: true
permissions:
  contents: read
  packages: write
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      upstream: ${{ steps.v.outputs.upstream }}
      repo: ${{ steps.v.outputs.repo }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#mempool-v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "bad version: $v" >&2; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "upstream=$(cat UPSTREAM_TAG)" >> "$GITHUB_OUTPUT"
          echo "repo=$(cat UPSTREAM_REPO)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: ours
      - uses: actions/checkout@v4
        with:
          repository: ${{ needs.prepare.outputs.repo }}
          ref: ${{ needs.prepare.outputs.upstream }}
          path: up
      - name: Apply the overlay and prepare the upstream docker context
        run: |
          set -eu
          python3 -I ours/tools/apply_overlay.py up
          cd up
          sha="$(git rev-parse --short HEAD)"
          echo "SHORT_SHA=$sha" >> "$GITHUB_ENV"
          docker/init.sh "${{ needs.prepare.outputs.upstream }}"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (frontend)
        if: matrix.service == 'frontend'
        uses: docker/build-push-action@v6
        with:
          context: up/frontend
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: commitHash=${{ env.SHORT_SHA }}
          tags: ghcr.io/${{ github.repository_owner }}/blake2b-mempool-frontend:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}
      - name: Build and push (backend)
        if: matrix.service == 'backend'
        uses: docker/build-push-action@v6
        with:
          context: up/backend
          build-contexts: |
            rustgbt=up/rust
            backend=up/backend
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: commitHash=${{ env.SHORT_SHA }}
          tags: ghcr.io/${{ github.repository_owner }}/blake2b-mempool-backend:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}

  manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Join the amd64 and arm64 images
        env:
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          for svc in frontend backend; do
            img="ghcr.io/$OWNER/blake2b-mempool-$svc"
            docker buildx imagetools create -t "$img:$VERSION" -t "$img:latest" "$img:$VERSION-amd64" "$img:$VERSION-arm64"
          done

  store:
    needs: [prepare, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update the store repo
        env:
          STORE_TOKEN: ${{ secrets.STORE_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          if [ -z "$STORE_TOKEN" ]; then echo "::notice::STORE_TOKEN is not set: the store's own sync-apps workflow will pick this release up"; exit 0; fi
          auth="$(printf 'x-access-token:%s' "$STORE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          if ! git -c "http.extraHeader=Authorization: Basic $auth" clone "https://github.com/$OWNER/blake2b.git" /tmp/store; then
            echo "::warning::Could not clone $OWNER/blake2b (check STORE_TOKEN). The store's sync-apps workflow will still pick this release up."
            exit 0
          fi
          rm -rf /tmp/store/blake2b-mempool
          cp -r blake2b-mempool /tmp/store/
          cd /tmp/store
          git add -A
          git diff --cached --quiet && { echo "store already up to date"; exit 0; }
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -m "blake2b-mempool $VERSION"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if ! git -c "http.extraHeader=Authorization: Basic $auth" push origin "HEAD:$branch"; then
            echo "::warning::Push to $OWNER/blake2b was refused (token needs Contents: write). The store's sync-apps workflow will still pick this release up."
            exit 0
          fi
