version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service-name>_1
      APP_HOST: blake2b-mempool_web_1
      APP_PORT: 8792
      PROXY_AUTH_ADD: "false"

  web:
    # Built from the newest Horizon-btc/mempool release plus this repo's overlay, by GitHub Actions (amd64 + arm64)
    image: ghcr.io/christhealien/blake2b-mempool-frontend:1.0.14
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for mariadb:3306 --timeout=720 -- nginx -g 'daemon off;'"
    environment:
      FRONTEND_HTTP_PORT: "8792"
      BACKEND_MAINNET_HTTP_HOST: api
      NGINX_PORT: "8792"
      NGINX_HOSTNAME: api
      AUDIT: "true"
      BLOCK_WEIGHT_UNITS: 800000
      ACCELERATOR_BUTTON: "false"

  api:
    image: ghcr.io/christhealien/blake2b-mempool-backend:1.0.14
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for-it.sh mariadb:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
      - ${APP_DATA_DIR}/data:/backend/cache
    environment:
      CORE_RPC_HOST: $APP_BITCOIN_NODE_IP
      CORE_RPC_PORT: $APP_BITCOIN_RPC_PORT
      CORE_RPC_USERNAME: $APP_BITCOIN_RPC_USER
      CORE_RPC_PASSWORD: $APP_BITCOIN_RPC_PASS
      ELECTRUM_HOST: $APP_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_ELECTRS_NODE_PORT
      ELECTRUM_TLS: "false"
      DATABASE_HOST: mariadb
      DATABASE_PORT: "3306"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      MEMPOOL_HTTP_PORT: "8999"
      MEMPOOL_CACHE_DIR: "/backend/cache"
      MEMPOOL_CLEAR_PROTECTION_MINUTES: "20"
      MEMPOOL_INDEXING_BLOCKS_AMOUNT: "52560"
      MEMPOOL_STDOUT_LOG_MIN_PRIORITY: "info"
      LIGHTNING_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=2048"
      MEMPOOL_BLOCKS_SUMMARIES_INDEXING: "true"
      MEMPOOL_GOGGLES_INDEXING: "true"
      MEMPOOL_AUDIT: "true"
      MEMPOOL_AUTOMATIC_POOLS_UPDATE: "true"
      MEMPOOL_POOLS_UPDATE_DELAY: "43200"
      MEMPOOL_POOLS_JSON_URL: "https://raw.githubusercontent.com/retropex/mining-pools/master/pools-v2.json"
      MEMPOOL_POOLS_JSON_TREE_URL: "https://api.github.com/repos/retropex/mining-pools/git/trees/master"
      MEMPOOL_BLOCK_WEIGHT_UNITS: 800000

  mariadb:
    image: mariadb:10.5.12@sha256:dfcba5641bdbfd7cbf5b07eeed707e6a3672f46823695a0d3aba2e49bbd9b1dd
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/mysql/data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "moneyprintergobrrr"

  widget-server:
    image: getumbrel/umbrel-mempool-widget-server:v1.0.0@sha256:099846e613c7310deba842241477737babcdf78250fba6edf39d456712eeefc3
    environment:
      MEMPOOL_API_URL: "http://web:8792/api/v1/fees/recommended"
    restart: on-failure
